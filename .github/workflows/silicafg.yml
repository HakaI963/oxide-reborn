name: Silica FG engine native

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to build from and commit the binaries to
        required: false
        default: main
        type: string

concurrency:
  group: silicafg-${{ inputs.branch }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  ANDROID_NDK_VERSION: "27.3.13750724"
  ANDROID_CMAKE_VERSION: "3.22.1"

jobs:
  build:
    name: Build libsilica_fg (${{ matrix.abi }})
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: true
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86_64, x86]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch }}
      - name: Locate the Android SDK
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(ls -d "${SDK_ROOT}"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1)"
          echo "ANDROID_HOME=${SDK_ROOT}" >> "${GITHUB_ENV}"
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "${GITHUB_ENV}"
          echo "SDKMANAGER=${SDKMANAGER}" >> "${GITHUB_ENV}"
          yes | "${SDKMANAGER}" --licenses > /dev/null || true
      - name: Install NDK and CMake
        run: '"${SDKMANAGER}" "ndk;${{ env.ANDROID_NDK_VERSION }}" "cmake;${{ env.ANDROID_CMAKE_VERSION }}" "platforms;android-35"'
      - name: Configure
        run: |
          set -euo pipefail
          NDK_HOME="${ANDROID_SDK_ROOT}/ndk/${{ env.ANDROID_NDK_VERSION }}"
          cmake -S OxideLauncher/src/main/cpp/silica_fg -B build/${{ matrix.abi }} -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="${NDK_HOME}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI="${{ matrix.abi }}" -DANDROID_PLATFORM=android-21 -DANDROID_STL=c++_static -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/${{ matrix.abi }} --target silica_fg -- -j4
      - name: Verify exports
        run: |
          set -euo pipefail
          SO="build/${{ matrix.abi }}/libsilica_fg.so"
          test -s "${SO}"
          NM="${ANDROID_SDK_ROOT}/ndk/${{ env.ANDROID_NDK_VERSION }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          SYM="silicafg-symbols-${{ matrix.abi }}.txt"
          "${NM}" -D --defined-only "${SO}" > "${SYM}"
          for sym in silica_fg_present_hook Java_dev_oxide_launcher_bridge_SilicaFgBridge_nativeConfigure Java_dev_oxide_launcher_bridge_SilicaFgBridge_nativeReloadTranslation; do
            if grep -q " ${sym}" "${SYM}"; then echo "OK: exports ${sym}"; else echo "::error::${sym} missing"; exit 1; fi
          done
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: libsilicafg-${{ matrix.abi }}
          path: build/${{ matrix.abi }}/libsilica_fg.so
          if-no-files-found: error
          retention-days: 7

  commit-libs:
    name: Commit libsilica_fg to jniLibs
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch }}
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: libsilicafg-*
          merge-multiple: false
      - name: Place binaries
        run: |
          set -euo pipefail
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            SRC="artifacts/libsilicafg-${abi}/libsilica_fg.so"
            DST="OxideLauncher/src/main/jniLibs/${abi}/libsilica_fg.so"
            test -s "${SRC}"
            cp "${SRC}" "${DST}"
          done
      - name: Commit and push
        run: |
          set -euo pipefail
          git add -A OxideLauncher/src/main/jniLibs
          if git diff --cached --quiet; then echo "Binaries unchanged.";
          else git -c user.name="oxide-ci" -c user.email="oxide-ci@users.noreply.github.com" commit -m "Silica FG engine lib (${{ inputs.branch }})"; git push; fi
