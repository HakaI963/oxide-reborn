name: Release

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag whose release the APKs are attached to"
        required: true
        type: string
      require_oauth_client_id:
        description: "Fail the build when the OAUTH_CLIENT_ID secret is missing instead of warning"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  ANDROID_NDK_VERSION: "25.2.9519653"

jobs:
  build:
    name: Build release APK (${{ matrix.arch }})
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        arch:
          - all
          - arm
          - arm64
          - x86
          - x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Locate the Android SDK
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(ls -d "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::cmdline-tools (sdkmanager) not found under $SDK_ROOT" >&2
            exit 1
          fi
          {
            echo "ANDROID_HOME=$SDK_ROOT"
            echo "ANDROID_SDK_ROOT=$SDK_ROOT"
            echo "SDKMANAGER=$SDKMANAGER"
          } >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses > /dev/null || true

      - name: Install NDK ${{ env.ANDROID_NDK_VERSION }}
        run: '"$SDKMANAGER" "ndk;${{ env.ANDROID_NDK_VERSION }}"'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          add-job-summary: on-failure

      # The Microsoft application (client) id lives in Actions secrets, never in the repository:
      # a committed one would let anyone impersonate this launcher's sign-in. An unconfigured
      # secret expands to an *empty string* rather than being absent, so a release assembled
      # without this check ships a blank client id and every Microsoft sign-in is rejected with
      # `invalid_client` - an error that points nowhere near the missing configuration.
      #
      # The repository has no such secret yet and it cannot be added from inside the repository, so
      # the default is a loud warning plus the exact remediation, and the build carries on. Only the
      # `all` matrix entry runs this so the job summary says it once rather than five times; the
      # value is repo-wide, so checking it per architecture would add nothing.
      - name: Check the Microsoft OAuth client id secret
        if: matrix.arch == 'all'
        env:
          OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
          REQUIRE_OAUTH_CLIENT_ID: ${{ inputs.require_oauth_client_id }}
        run: |
          set -euo pipefail
          if [ -n "${OAUTH_CLIENT_ID:-}" ]; then
            echo "OAUTH_CLIENT_ID is set (${#OAUTH_CLIENT_ID} characters; value not shown)."
            exit 0
          fi
          {
            echo "## :warning: The \`OAUTH_CLIENT_ID\` secret is not set"
            echo
            echo "The APKs from this run ship **without** a Microsoft application (client) id, so every"
            echo "Microsoft sign-in will be rejected by Microsoft with \`invalid_client\`."
            echo
            echo "### Remediation"
            echo
            echo 'Register the id once as a repository secret:'
            echo
            echo '```sh'
            echo "gh secret set OAUTH_CLIENT_ID                       # prompts for the value"
            echo "gh secret set OAUTH_CLIENT_ID --body '<client id>'   # or pass it inline"
            echo '```'
            echo
            echo "Or in the repository UI: **Settings > Secrets and variables > Actions > New repository"
            echo "secret**, named \`OAUTH_CLIENT_ID\`. Then re-run this workflow."
            echo
            echo "The value is the **Application (client) ID** of the Azure AD app registration that the"
            echo "Microsoft login flow uses (tenant \`consumers\`, device code flow, so no redirect URI is"
            echo "needed). \`.oauth_client_id.txt\` next to the root build script, or the \`oauth_client_id\`"
            echo "Gradle property, work as local sources."
            echo
            echo "To make a missing secret **fail** the build instead of warning, dispatch this workflow"
            echo "with \`require_oauth_client_id\` enabled."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning::OAUTH_CLIENT_ID secret is not set; Microsoft sign-in will fail with invalid_client. See the job summary."
          if [ "${REQUIRE_OAUTH_CLIENT_ID:-false}" = "true" ]; then
            echo "::error::require_oauth_client_id was requested but the OAUTH_CLIENT_ID secret is empty."
            exit 1
          fi
          echo "Continuing: the secret is not set yet, and it can only be added from outside the repository."

      # The release keystore is not part of the repository. Restore the stored key when the
      # repository provides one, so consecutive releases can be upgrade-installed; otherwise
      # create an ephemeral key that is valid for this run only.
      - name: Prepare signing material
        env:
          OXIDE_KEYSTORE_BASE64: ${{ secrets.OXIDE_KEYSTORE_BASE64 }}
          OXIDE_KEYSTORE_PASSWORD: ${{ secrets.OXIDE_KEYSTORE_PASSWORD }}
          OXIDE_KEY_ALIAS: ${{ secrets.OXIDE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          KEYSTORE=OxideLauncher/oxide_launcher.jks
          ALIAS="${OXIDE_KEY_ALIAS:-oxide}"
          PASSWORD="${OXIDE_KEYSTORE_PASSWORD:-}"
          if [ -n "${OXIDE_KEYSTORE_BASE64:-}" ] && [ -n "$PASSWORD" ]; then
            printf '%s' "$OXIDE_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE"
            echo "Restored the stored release keystore (alias: $ALIAS)."
          else
            PASSWORD="$(head -c 48 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 24)"
            "$JAVA_HOME/bin/keytool" -genkeypair -v \
              -keystore "$KEYSTORE" \
              -storetype PKCS12 \
              -storepass "$PASSWORD" -keypass "$PASSWORD" \
              -alias "$ALIAS" \
              -keyalg RSA -keysize 4096 -validity 10950 \
              -dname "CN=Oxide Launcher, OU=Oxide Launcher, O=Oxide Launcher, C=ZZ"
            echo "Generated an ephemeral release keystore for this run."
          fi
          {
            echo "STORE_PASSWORD=$PASSWORD"
            echo "KEY_PASSWORD=$PASSWORD"
            echo "KEY_ALIAS=$ALIAS"
          } >> "$GITHUB_ENV"

      # The flag is empty unless require_oauth_client_id was requested, so the default is the
      # Gradle task's warning-and-continue behaviour. The expansion is deliberately unquoted: an
      # empty value then disappears entirely instead of reaching Gradle as an empty argument.
      - name: Assemble release APK
        env:
          OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          OAUTH_REQUIRE_FLAG: ${{ inputs.require_oauth_client_id && '-PrequireOauthClientId=true' || '' }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleRelease -Darch=${{ matrix.arch }} ${OAUTH_REQUIRE_FLAG:-}

      # Per-ABI integrity gates. Any failure here stops the APK before it can
      # reach an artifact or a release (same defect class as the 1.13.0 debug
      # "invalid stored block lengths" report).
      - name: Validate release APK (${{ matrix.arch }})
        run: |
          set -euo pipefail
          APK="$(ls OxideLauncher/build/outputs/apk/release/*.apk | head -1)"
          test -s "$APK"
          echo "APK=$APK"
          ls -lh "$APK"
          sha256sum "$APK" | tee "$APK.sha256"
          unzip -t "$APK"
          unzip -l "$APK" | tail -2
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          BT="$(ls -d "$SDK_ROOT"/build-tools/* 2>/dev/null | sort -V | tail -1)"
          "$BT/zipalign" -c 4 "$APK"
          "$BT/apksigner" verify --verbose "$APK"
          echo "release APK integrity gates passed for ${{ matrix.arch }}"

      # Renderer gate: the release must ship ONIGAMI and must not ship the
      # removed Silica backend. A silent regression here would ship the wrong
      # backend, so it fails the build instead of being reported later.
      - name: Verify renderer libraries in the release APK
        run: |
          set -euo pipefail
          APK=$(ls OxideLauncher/build/outputs/apk/release/*.apk | head -1)
          LIST=$(unzip -Z1 "$APK" | grep '^lib/' || true)
          ONIGAMI=$(printf '%s\n' "$LIST" | grep -c libonigami || true)
          SILICA=$(printf '%s\n' "$LIST" | grep -c libsilica || true)
          echo libonigami_so_entries=$ONIGAMI
          echo libsilica_so_entries=$SILICA
          test "$ONIGAMI" -ge 1 || { echo '::error::libonigami.so is missing from the release APK'; exit 1; }
          test "$SILICA" -eq 0 || { echo '::error::libsilica.so must not be in the release APK'; exit 1; }
          printf '%s\n' "$LIST" | grep libonigami | sort
          echo renderer gate passed for ${{ matrix.arch }}
      - name: Upload release APK (${{ matrix.arch }})
        uses: actions/upload-artifact@v7
        with:
          name: release-apk-${{ matrix.arch }}
          path: OxideLauncher/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7

  attach:
    name: Attach APKs to the release
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'release'

    steps:
      - name: Download APKs
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: release-apk-*
          merge-multiple: true

      # The exact files about to be published are re-validated after the
      # artifact round trip; a transit-corrupted APK never becomes a release.
      - name: Validate downloaded APKs (all ABIs)
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          BT="$(ls -d "$SDK_ROOT"/build-tools/* 2>/dev/null | sort -V | tail -1)"
          for APK in ./artifacts/*.apk; do
            echo "=== $APK ==="
            ls -lh "$APK"
            if [ -f "$APK.sha256" ]; then
              (cd ./artifacts && sha256sum -c "$(basename "$APK").sha256") || { echo "::error::hash mismatch" >&2; exit 1; }
            fi
            unzip -t "$APK"
            "$BT/zipalign" -c 4 "$APK"
            "$BT/apksigner" verify "$APK"
          done
          echo "all release APKs pass integrity and renderer gates after download"
            LIST=$(unzip -Z1 "$APK" | grep '^lib/' || true)
            ONIGAMI=$(printf '%s\n' "$LIST" | grep -c libonigami || true)
            SILICA=$(printf '%s\n' "$LIST" | grep -c libsilica || true)
            echo "$APK" libonigami_so_entries=$ONIGAMI libsilica_so_entries=$SILICA
            test "$ONIGAMI" -ge 1 || { echo "::error::libonigami.so missing from $APK"; exit 1; }
            test "$SILICA" -eq 0 || { echo "::error::libsilica.so present in $APK"; exit 1; }

      - name: List APKs
        run: |
          set -euo pipefail
          ls -lh ./artifacts
          test -n "$(find ./artifacts -name '*.apk' -type f -print -quit)"

      - name: Attach APKs to the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: ./artifacts/*.apk
          fail_on_unmatched_files: true)
          ONIGAMI=$(printf '%s\n' "$LIST" | grep -c 'libonigami.so' || true)
          SILICA=$(printf '%s\n' "$LIST" | grep -c 'libsilica.so' || true)
          echo libonigami_so_entries=$ONIGAMI
          echo libsilica_so_entries=$SILICA
          test "$ONIGAMI" -ge 1 || { echo '::error::libonigami.so missing from release APK'; exit 1; }
          test "$SILICA" -eq 0 || { echo '::error::libsilica.so must not be in release APK'; exit 1; }
          printf '%s\n' "$LIST" | grep libonigami.so | sort
          echo renderer gate passed for ${{ matrix.arch }}


      - name: Upload release APK (${{ matrix.arch }})
        uses: actions/upload-artifact@v7
        with:
          name: release-apk-${{ matrix.arch }}
          path: OxideLauncher/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7

  attach:
    name: Attach APKs to the release
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'release'

    steps:
      - name: Download APKs
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: release-apk-*
          merge-multiple: true

      # The exact files about to be published are re-validated after the
      # artifact round trip; a transit-corrupted APK never becomes a release.
      - name: Validate downloaded APKs (all ABIs)
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          BT="$(ls -d "$SDK_ROOT"/build-tools/* 2>/dev/null | sort -V | tail -1)"
          for APK in ./artifacts/*.apk; do
            echo "=== $APK ==="
            ls -lh "$APK"
            if [ -f "$APK.sha256" ]; then
              (cd ./artifacts && sha256sum -c "$(basename "$APK").sha256") || { echo "::error::hash mismatch" >&2; exit 1; }
            fi
            unzip -t "$APK"
            "$BT/zipalign" -c 4 "$APK"
            "$BT/apksigner" verify "$APK"
          done
          echo "all release APKs pass integrity gates after download"

      - name: List APKs
        run: |
          set -euo pipefail
          ls -lh ./artifacts
          test -n "$(find ./artifacts -name '*.apk' -type f -print -quit)"

      - name: Attach APKs to the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: ./artifacts/*.apk
          fail_on_unmatched_files: true