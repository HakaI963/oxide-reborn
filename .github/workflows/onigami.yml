name: Onigami native

# Builds libonigami.so (OWN backend, no foreign renderer sources) for 4 ABIs and
# commits the binaries to jniLibs. Dispatch-only: compiler-stack build per ABI.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to build from and commit the binaries to
        required: false
        default: main
        type: string

concurrency:
  group: onigami-${{ inputs.branch }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  ANDROID_NDK_VERSION: "27.3.13750724"
  ANDROID_CMAKE_VERSION: "3.22.1"

jobs:
  build:
    name: Build libonigami (${{ matrix.abi }})
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: true
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86_64, x86]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch }}
      - name: Locate the Android SDK
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(ls -d "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1)"
          {
            echo "ANDROID_HOME=$SDK_ROOT"
            echo "ANDROID_SDK_ROOT=$SDK_ROOT"
            echo "SDKMANAGER=$SDKMANAGER"
          } >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
      - name: Install NDK and CMake
        run: '"$SDKMANAGER" "ndk;${{ env.ANDROID_NDK_VERSION }}" "cmake;${{ env.ANDROID_CMAKE_VERSION }}" "platforms;android-35"'
      - name: Configure
        run: |
          set -euo pipefail
          NDK_HOME="$ANDROID_SDK_ROOT/ndk/${{ env.ANDROID_NDK_VERSION }}"
          GEN_COMMIT="$(git rev-parse --short HEAD 2>/dev/null || echo unknown)"
          cmake -S OxideLauncher/src/main/cpp/onigami -B build/${{ matrix.abi }} -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI="${{ matrix.abi }}" \
            -DANDROID_PLATFORM=android-21 \
            -DANDROID_STL=c++_static \
            "-DONIGAMI_BUILD_COMMIT=${GEN_COMMIT}" \
            -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/${{ matrix.abi }} --target onigami -- -j4
      - name: Verify exports and no foreign linkage
        run: |
          set -euo pipefail
          SO="build/${{ matrix.abi }}/libonigami.so"
          test -s "$SO"
          ls -lh "$SO"
          NM="$ANDROID_SDK_ROOT/ndk/${{ env.ANDROID_NDK_VERSION }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          SYM="symbols-${{ matrix.abi }}.txt"
          "$NM" -D --defined-only "$SO" > "$SYM"
          echo "nm exit: $?"
          for sym in onigami_version onigami_build_id onigami_last_diag eglGetDisplay eglInitialize eglChooseConfig eglCreateContext eglMakeCurrent eglSwapBuffers eglGetProcAddress eglGetError glGetString glUseProgram glBindTexture glDrawElements glTexImage2D glCheckFramebufferStatus; do
            if grep -q " $sym" "$SYM"; then
              echo "OK: exports $sym"
            else
              echo "::error::$sym missing from libonigami"
              exit 1
            fi
          done
          if grep -qi "mobileglues\|copperoxide\|mg_context\|silica" "$SYM"; then
            echo "::error::foreign renderer symbols leaked into libonigami"
            exit 1
          else
            echo "OK: no foreign renderer symbols"
          fi
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: libonigami-${{ matrix.abi }}
          path: build/${{ matrix.abi }}/libonigami.so
          if-no-files-found: error
          retention-days: 7

  commit-libs:
    name: Commit libonigami to jniLibs
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch }}
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: libonigami-*
          merge-multiple: false
      - name: Place binaries
        run: |
          set -euo pipefail
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            SRC="artifacts/libonigami-$abi/libonigami.so"
            DST="OxideLauncher/src/main/jniLibs/$abi/libonigami.so"
            test -s "$SRC"
            cp "$SRC" "$DST"
          done
          ls -lh OxideLauncher/src/main/jniLibs/*/libonigami.so
      - name: Commit and push
        run: |
          set -euo pipefail
          git add -A OxideLauncher/src/main/jniLibs
          if git diff --cached --quiet; then
            echo "Binaries unchanged; nothing to commit."
            exit 0
          fi
          git -c user.name="oxide-ci" -c user.email="oxide-ci@users.noreply.github.com" \
            commit -m "Onigami native: libonigami.so own backend (NDK 27.3, CMake 3.22.1, Release, no foreign linkage)"
          git push origin HEAD:${{ inputs.branch }}

  host-test:
    name: Host translator regression test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build and run translator tests on host
        run: |
          set -euo pipefail
          g++ --version
          g++ -std=c++20 -Wall -Wextra -Werror \
            -IOxideLauncher/src/main/cpp/onigami/include \
            -IOxideLauncher/src/main/cpp/onigami/tests/host_include \
            OxideLauncher/src/main/cpp/onigami/tests/host/test_translator.cpp \
            OxideLauncher/src/main/cpp/onigami/src/shader_translate.cpp \
            -o /tmp/test_translator
          /tmp/test_translator
          g++ -std=c++20 -Wall -Wextra -Werror \
            -IOxideLauncher/src/main/cpp/onigami/include \
            -IOxideLauncher/src/main/cpp/onigami/tests/host_include \
            -IOxideLauncher/src/main/cpp/onigami/src \
            OxideLauncher/src/main/cpp/onigami/tests/host/test_state_cache.cpp \
            OxideLauncher/src/main/cpp/onigami/src/state_cache.cpp \
            OxideLauncher/src/main/cpp/onigami/tests/host/stub_config.cpp \
            -o /tmp/test_state_cache
          /tmp/test_state_cache
          # Long-tail policy: asserts that every classified entry point is
          # backed by a real ES 3.2 symbol (kForward) or an exact emulation
          # (kEmulate), and that nothing is claimed which the backend lacks.
          # Runs against the vendored GLES 3.2 header so a fabricated forward
          # fails the build instead of passing CI and rendering nothing.
          g++ -std=c++20 -Wall -Wextra -Werror \
            -IOxideLauncher/src/main/cpp/onigami/include \
            -IOxideLauncher/src/main/cpp/onigami/tests/host_include \
            -IOxideLauncher/src/main/cpp/onigami/src \
            OxideLauncher/src/main/cpp/onigami/tests/host/test_longtail.cpp \
            OxideLauncher/src/main/cpp/onigami/src/gl_longtail.cpp \
            OxideLauncher/src/main/cpp/onigami/tests/host/stub_backend.cpp \
            -o /tmp/test_longtail
          (cd OxideLauncher/src/main/cpp/onigami && /tmp/test_longtail)
          # Multi-draw contract: the expansion semantics and that the entry
          # points are exported, checked against a real shared object built
          # from the library's own frontend.
          g++ -std=c++20 -fPIC -shared \
            -IOxideLauncher/src/main/cpp/onigami/include \
            -IOxideLauncher/src/main/cpp/onigami/tests/host_include \
            -IOxideLauncher/src/main/cpp/onigami/src \
            OxideLauncher/src/main/cpp/onigami/src/*.cpp \
            -o /tmp/libonigami_probe.so
          g++ -std=c++20 -Wall -Wextra -I. \
            -IOxideLauncher/src/main/cpp/onigami/include \
            -IOxideLauncher/src/main/cpp/onigami/tests/host_include \
            -IOxideLauncher/src/main/cpp/onigami/src \
            -DONIGAMI_TEST_PROBE_SO='"/tmp/libonigami_probe.so"' \
            OxideLauncher/src/main/cpp/onigami/tests/host/test_multidraw.cpp \
            OxideLauncher/src/main/cpp/onigami/src/gl_longtail.cpp \
            OxideLauncher/src/main/cpp/onigami/tests/host/stub_backend.cpp \
            -o /tmp/test_multidraw
          /tmp/test_multidraw
