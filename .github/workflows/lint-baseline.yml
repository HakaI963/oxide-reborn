name: Lint baseline

# Regenerates OxideLauncher/lint-baseline.xml, the record of lint findings that are knowingly
# accepted rather than fixed blind. Run this deliberately after reviewing the new lint report.
#
# With `commit` it also pushes the regenerated file to the default branch. That has to happen
# here rather than by hand: the baseline is over a megabyte, which is past what a file read
# through the contents API will even decode, so there is no other way to get it into git.

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Push the regenerated baseline to the default branch
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  ANDROID_NDK_VERSION: "25.2.9519653"

jobs:
  update-baseline:
    name: Regenerate the lint baseline
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Locate the Android SDK
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(ls -d "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::cmdline-tools (sdkmanager) not found under $SDK_ROOT" >&2
            exit 1
          fi
          {
            echo "ANDROID_HOME=$SDK_ROOT"
            echo "ANDROID_SDK_ROOT=$SDK_ROOT"
            echo "SDKMANAGER=$SDKMANAGER"
          } >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses > /dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          add-job-summary: on-failure

      - name: Regenerate the baseline
        run: |
          chmod +x ./gradlew
          rm -f OxideLauncher/lint-baseline.xml
          ./gradlew --no-daemon lintDebug updateLintBaseline || true

      - name: Commit the regenerated baseline
        if: inputs.commit
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git add OxideLauncher/lint-baseline.xml
          if git diff --cached --quiet -- OxideLauncher/lint-baseline.xml; then
            echo "The baseline already matches; nothing to commit."
            exit 0
          fi
          git -c user.name="oxide-ci" -c user.email="oxide-ci@users.noreply.github.com" \
            commit -m "Regenerate the lint baseline"
          git push origin HEAD:${{ github.event.repository.default_branch }}

      - name: Upload the regenerated baseline
        uses: actions/upload-artifact@v7
        with:
          name: lint-baseline
          path: OxideLauncher/lint-baseline.xml
          if-no-files-found: error
          retention-days: 30