name: Lint baseline

# Regenerates OxideLauncher/lint-baseline.xml, the record of lint findings inherited from the
# upstream baseline. Run this deliberately after reviewing the new lint report, commit the
# resulting file, and CI will then fail only on findings that are not recorded there.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_NDK_VERSION: "25.2.9519653"

jobs:
  update-baseline:
    name: Regenerate the lint baseline
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Locate the Android SDK
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(ls -d "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::cmdline-tools (sdkmanager) not found under $SDK_ROOT" >&2
            exit 1
          fi
          {
            echo "ANDROID_HOME=$SDK_ROOT"
            echo "ANDROID_SDK_ROOT=$SDK_ROOT"
            echo "SDKMANAGER=$SDKMANAGER"
          } >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses > /dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          add-job-summary: on-failure

      - name: Regenerate the baseline
        run: |
          chmod +x ./gradlew
          rm -f OxideLauncher/lint-baseline.xml
          ./gradlew --no-daemon lintDebug updateLintBaseline || true

      - name: Upload the regenerated baseline
        uses: actions/upload-artifact@v7
        with:
          name: lint-baseline
          path: OxideLauncher/lint-baseline.xml
          if-no-files-found: error
          retention-days: 30