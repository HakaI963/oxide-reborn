name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ANDROID_NDK_VERSION: "25.2.9519653"

jobs:
  verify:
    name: Unit tests, lint and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licences
        run: |
          yes | sdkmanager --licenses > /dev/null || true

      - name: Install NDK ${{ env.ANDROID_NDK_VERSION }}
        run: sdkmanager "ndk;${{ env.ANDROID_NDK_VERSION }}"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          add-job-summary: on-failure

      - name: Gradle configuration check
        run: ./gradlew --no-daemon help

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest testReleaseUnitTest

      - name: Android Lint
        run: ./gradlew --no-daemon lintDebug

      - name: Assemble debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: |
            OxideLauncher/build/reports/lint-results-*.html
            OxideLauncher/build/reports/lint-results-*.xml
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: debug-apk
          path: OxideLauncher/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7