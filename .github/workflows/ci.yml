name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ANDROID_NDK_VERSION: "25.2.9519653"

jobs:
  verify:
    name: Unit tests, lint and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # The ubuntu runner image already ships the Android SDK and cmdline-tools. Resolve
      # sdkmanager explicitly instead of relying on an action that installs the retired
      # "tools" package.
      - name: Locate the Android SDK
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(ls -d "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::cmdline-tools (sdkmanager) not found under $SDK_ROOT" >&2
            exit 1
          fi
          {
            echo "ANDROID_HOME=$SDK_ROOT"
            echo "ANDROID_SDK_ROOT=$SDK_ROOT"
            echo "SDKMANAGER=$SDKMANAGER"
          } >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          echo "Using $SDKMANAGER"

      - name: Install NDK ${{ env.ANDROID_NDK_VERSION }}
        run: '"$SDKMANAGER" "ndk;${{ env.ANDROID_NDK_VERSION }}"'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          add-job-summary: on-failure

      - name: Gradle configuration check
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon help

      # An unqualified task name runs in every module that declares it, so this covers
      # :OxideLauncher plus the :CardGrid and :Guide unit test suites.
      # Cheap lexer-level gate before Gradle. A KDoc containing `*/*` closes its
      # own block comment, the rest of the file is parsed as top-level
      # declarations, and the compiler reports the cascade dozens of lines away
      # from the cause. This finds the cause in about a second.
      - name: Kotlin source sanity scan
        run: |
          python3 tools/kotlin-sanity-selftest.py
          python3 tools/kotlin-sanity.py OxideLauncher/src

      - name: Unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon testDebugUnitTest

      - name: Android Lint
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon lintDebug

      - name: Assemble debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug

      # Exercises R8 and the ProGuard keep rules (which name the renamed JNI classes) on every
      # push, so a release-only breakage cannot reach a published release. OAUTH_CLIENT_ID comes
      # from the same secret release.yml uses, so this step assembles with exactly the value a
      # release build gets rather than with an empty client id that release.yml would also have
      # produced.
      # APK/ZIP integrity gates. CI green alone never proves an installable
      # APK: every check below fails the workflow explicitly (MT Manager
      # "invalid stored block lengths" class defects must break the build here).
      - name: Validate debug APK (integrity gates)
        run: |
          set -euo pipefail
          APK="$(ls OxideLauncher/build/outputs/apk/debug/*.apk | head -1)"
          test -s "$APK"
          echo "APK=$APK"
          ls -lh "$APK"
          sha256sum "$APK" | tee "$APK.sha256"
          echo "--- unzip -t (full DEFLATE + CRC over every entry) ---"
          unzip -t "$APK"
          echo "--- central directory entry count ---"
          unzip -l "$APK" | tail -3
          BT="$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* 2>/dev/null | sort -V | tail -1 || true)"
          if [ -z "$BT" ]; then
            echo "build-tools missing, installing 35.0.0"
            yes | "$SDKMANAGER" "build-tools;35.0.0" > /dev/null
            BT="$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* 2>/dev/null | sort -V | tail -1)"
          fi
          test -x "$BT/zipalign" || { echo "::error::zipalign not found in $BT" >&2; exit 1; }
          test -x "$BT/apksigner" || { echo "::error::apksigner not found in $BT" >&2; exit 1; }
          echo "--- zipalign -c 4 ---"
          "$BT/zipalign" -c 4 "$APK"
          echo "--- apksigner verify ---"
          "$BT/apksigner" verify --verbose "$APK"
          echo "APK integrity gates passed for $APK"

      - name: Upload debug APK sha256
        uses: actions/upload-artifact@v7
        with:
          name: debug-apk-sha256
          path: OxideLauncher/build/outputs/apk/debug/*.sha256
          if-no-files-found: error
          retention-days: 7
      - name: Assemble release APK (R8 check, arm64)
        env:
          OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleRelease -Darch=arm64

      # Gradle only puts the exception class and the line into the console; the assertion
      # message lives in the JUnit XML. Without this step a failure reads as
      # "java.lang.AssertionError at Foo.kt:110" and nothing else.
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            OxideLauncher/build/test-results/**
            OxideLauncher/build/reports/tests/**
            CardGrid/build/test-results/**
            Guide/build/test-results/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: |
            OxideLauncher/build/reports/lint-results-*.html
            OxideLauncher/build/reports/lint-results-*.xml
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: debug-apk
          path: OxideLauncher/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

  verify-downloaded-apk:
    # Proves the upload/download round trip is intact: the exact bytes a
    # tester pulls must match the bytes validated before upload, and must
    # still pass every integrity gate after transit.
    name: Re-validate downloaded debug APK
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Download debug APK
        uses: actions/download-artifact@v8
        with:
          name: debug-apk
          path: downloaded
      - name: Download pre-upload sha256
        uses: actions/download-artifact@v8
        with:
          name: debug-apk-sha256
          path: expected
      - name: Compare and re-validate
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          APK="$(ls downloaded/*.apk | head -1)"
          EXP="$(cat expected/*.sha256 | awk '{print $1}')"
          ACT="$(sha256sum "$APK" | awk '{print $1}')"
          echo "expected=$EXP"
          echo "actual  =$ACT"
          ls -lh "$APK"
          [ "$EXP" = "$ACT" ] || { echo "::error::downloaded APK hash differs from pre-upload hash (transit corruption)" >&2; exit 1; }
          echo "hash match: upload/download round trip is byte-identical"
          unzip -t "$APK"
          BT="$(ls -d "$SDK_ROOT"/build-tools/* 2>/dev/null | sort -V | tail -1)"
          "$BT/zipalign" -c 4 "$APK"
          "$BT/apksigner" verify "$APK"
          echo "downloaded APK passes all integrity gates"
