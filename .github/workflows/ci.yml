name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ANDROID_NDK_VERSION: "25.2.9519653"

jobs:
  verify:
    name: Unit tests, lint and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # The ubuntu runner image already ships the Android SDK and cmdline-tools. Resolve
      # sdkmanager explicitly instead of relying on an action that installs the retired
      # "tools" package.
      - name: Locate the Android SDK
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(ls -d "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::cmdline-tools (sdkmanager) not found under $SDK_ROOT" >&2
            exit 1
          fi
          {
            echo "ANDROID_HOME=$SDK_ROOT"
            echo "ANDROID_SDK_ROOT=$SDK_ROOT"
            echo "SDKMANAGER=$SDKMANAGER"
          } >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          echo "Using $SDKMANAGER"

      - name: Install NDK ${{ env.ANDROID_NDK_VERSION }}
        run: '"$SDKMANAGER" "ndk;${{ env.ANDROID_NDK_VERSION }}"'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          add-job-summary: on-failure

      - name: Gradle configuration check
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon help

      # An unqualified task name runs in every module that declares it, so this covers
      # :OxideLauncher plus the :CardGrid and :Guide unit test suites.
      - name: Unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon testDebugUnitTest

      - name: Android Lint
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon lintDebug

      - name: Assemble debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug

      # Exercises R8 and the ProGuard keep rules (which name the renamed JNI classes) on every
      # push, so a release-only breakage cannot reach a published release.
      - name: Assemble release APK (R8 check, arm64)
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleRelease -Darch=arm64

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: |
            OxideLauncher/build/reports/lint-results-*.html
            OxideLauncher/build/reports/lint-results-*.xml
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: debug-apk
          path: OxideLauncher/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7