# Oxide Launcher — launcher identity
# The display name is injected into AndroidManifest.xml as the manifest placeholder
# "launcher_name" and into BuildKeys.LAUNCHER_NAME for all user visible product strings.
launcher_name=OxideLauncher
launcher_app_name=Oxide Launcher
launcher_short_name=OL
url_home=https://github.com/HakaI963/oxide-reborn

# your OAuth client id (Azure AD app used for the Microsoft login flow)
# Stays commented on purpose: committing an application (client) id would let anyone impersonate
# this launcher's Microsoft sign-in, and an unset one is reported by the verifyOauthClientId task.
# Supply it as the OAUTH_CLIENT_ID environment variable, as a .oauth_client_id.txt file next to the
# root build script, or by uncommenting the line below locally. The verifyOauthClientId task warns
# and continues when it is absent; pass -PrequireOauthClientId=true to make it a build failure.
#oauth_client_id=xxx

# CurseForge API key
# Client identifier shipped with the app, the same way every CurseForge client carries one.
# It is only ever sent as the x-api-key request header, never logged and never shown in the UI.
# Override it with the CURSEFORGE_API_KEY environment variable or a .curseforge_api.txt file.
curseforge_api_key=$2a$10$CZqApA4RiBYnQwQG94EBtO/GP0bEY30KSW2OcWU6hCNBDPFBhmecG

# launcher version
launcher_version_code=101400
launcher_version_name=1.14.0

# The version the launcher shows to the user. This is deliberately NOT the same as
# launcher_version_name: that one is build/update identity (and goes into the user agent and
# the update channel), while this is the product label shown in About, the sidebar footer and
# the crash header. GitHub release is v1.13.0; the app says 1.0.0.
launcher_display_version=1.0.0

# --- Paparazzi screenshot testing ---------------------------------------------
# Paparazzi 2.x has no `paparazzi { }` DSL; these are its only knobs. See the comment block at
# the bottom of OxideLauncher/build.gradle.kts for why they live here instead of in the script.
# The report type stays on the default "legacy" reporter because this project is JUnit 4; the
# native reporter needs Gradle 9.4+ and JUnit Platform, and gains nothing here.
app.cash.paparazzi.reportType=legacy
# verify tolerates a tiny amount of antialiasing drift, but a real layout change is never
# "close enough". 0.1% is deliberately strict: these goldens are rendered at density 1.0 with
# a pinned font stack, so a correct render is byte-identical every time.
app.cash.paparazzi.maxPercentDifference=0.1
# A near-miss must fail the build rather than quietly rewrite the committed golden, otherwise a
# one-pixel regression can never land on main. Re-record deliberately with cleanRecordPaparazziDebug.
app.cash.paparazzi.overwriteOnMaxPercentDifference=false
