# Oxide Launcher — launcher identity
# The display name is injected into AndroidManifest.xml as the manifest placeholder
# "launcher_name" and into BuildKeys.LAUNCHER_NAME for all user visible product strings.
launcher_name=OxideLauncher
launcher_app_name=Oxide Launcher
launcher_short_name=OL
url_home=https://github.com/HakaI963/oxide-reborn

# your OAuth client id (Azure AD app used for the Microsoft login flow)
#oauth_client_id=xxx

# CurseForge API key
# Client identifier shipped with the app, the same way every CurseForge client carries one.
# It is only ever sent as the x-api-key request header, never logged and never shown in the UI.
# Override it with the CURSEFORGE_API_KEY environment variable or a .curseforge_api.txt file.
curseforge_api_key=$2a$10$CZqApA4RiBYnQwQG94EBtO/GP0bEY30KSW2OcWU6hCNBDPFBhmecG

# launcher version
launcher_version_code=100300
launcher_version_name=1.3.0
